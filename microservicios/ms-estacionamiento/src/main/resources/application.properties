spring.application.name=ms-estacionamiento
server.port=${SERVER_PORT:8087}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3315/estacionamientos_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USER:demo}
spring.datasource.password=${DB_PASSWORD:Demo123!}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# URLs de los otros microservicios (en Docker se sobrescriben por variables de entorno)
vehiculo.base-url=${VEHICULO_URL:http://localhost:8084}
notificacion.base-url=${NOTIFICACION_URL:http://localhost:8085}
