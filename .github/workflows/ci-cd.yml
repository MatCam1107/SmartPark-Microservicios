name: SmartPark CI/CD Pipeline on: push: branches: [ "main", "feature/\*" ] pull\_request: branches: [ "main" ] jobs: # ========================================== # ETAPA 1: BUILD &amp; UNIT TESTING (Maven) # ========================================== build-and-test: name: Build &amp; Test Microservices runs-on: ubuntu-latest strategy: matrix: service: - ms-usuario - ms-vehiculo - ms-notificacion - ms-ubicacion - ms-estacionamiento steps: - name: Checkout del repositorio uses: actions/checkout@v4 - name: Configurar Java 21 (Temurin) uses: actions/setup-java@v4 with: java-version: '21' distribution: 'temurin' cache: maven - name: Compilar y ejecutar pruebas unitarias con Maven working-directory: ${{ matrix.service }} run: | mvn clean test package -DskipTests=false # ========================================== # ETAPA 2: DOCKER BUILD &amp; VERIFICATION # ========================================== docker-build: name: Package Docker Images needs: build-and-test runs-on: ubuntu-latest steps: - name: Checkout del repositorio uses: actions/checkout@v4 - name: Configurar Docker Buildx uses: docker/setup-buildx-action@v3 - name: Validar y construir imágenes locales run: | docker compose build --parallel