events {}

http {
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        set $usuarios http://ms-usuario:8080;
        set $vehiculos http://ms-vehiculo:8080;
        set $notificaciones http://ms-notificacion:8080;
        set $ubicaciones http://ms-ubicacion:8080;
        set $estacionamientos http://ms-estacionamiento:8080;

        location /auth/ {
            proxy_pass $usuarios;
        }

        location /api/usuarios {
            proxy_pass $usuarios;
        }

        location /api/vehiculos {
            proxy_pass $vehiculos;
        }

        location /api/notificaciones {
            proxy_pass $notificaciones;
        }

        location /api/zonas {
            proxy_pass $ubicaciones;
        }

        location /api/ubicaciones {
            proxy_pass $ubicaciones;
        }

        location /api/estacionamientos {
            proxy_pass $estacionamientos;
        }

        location /api/asignaciones {
            proxy_pass $estacionamientos;
        }
    }
}