services:
  api-gateway:
    image: nginx:alpine
    container_name: smartpark-gateway
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - smartpark-overlay
    restart: unless-stopped

networks:
  smartpark-overlay:
    external: true
    name: smartpark_smartpark-overlay