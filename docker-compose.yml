services:

  mysql-usuarios:
    image: mysql:8.4
    container_name: mysql-usuarios
    environment:
      MYSQL_DATABASE: usuarios_db
      MYSQL_USER: demo
      MYSQL_PASSWORD: Demo123!
      MYSQL_ROOT_PASSWORD: Root123!
    ports:
      - "3311:3306"
    volumes:
      - usuarios_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  ms-usuario:
    build:
      context: ./microservicios/ms-usuario
    container_name: ms-usuario
    ports:
      - "8083:8080"
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:mysql://mysql-usuarios:3306/usuarios_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      DB_USER: demo
      DB_PASSWORD: Demo123!
    depends_on:
      mysql-usuarios:
        condition: service_healthy

  mysql-vehiculos:
    image: mysql:8.4
    container_name: mysql-vehiculos
    environment:
      MYSQL_DATABASE: vehiculos_db
      MYSQL_USER: demo
      MYSQL_PASSWORD: Demo123!
      MYSQL_ROOT_PASSWORD: Root123!
    ports:
      - "3312:3306"
    volumes:
      - vehiculos_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  ms-vehiculo:
    build:
      context: ./microservicios/ms-vehiculo
    container_name: ms-vehiculo
    ports:
      - "8084:8080"
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:mysql://mysql-vehiculos:3306/vehiculos_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      DB_USER: demo
      DB_PASSWORD: Demo123!
    depends_on:
      mysql-vehiculos:
        condition: service_healthy

volumes:
  usuarios_data:
  vehiculos_data: