      DB_USER: demo
      DB_PASSWORD: Demo123!
      VEHICULO_URL: http://ms-vehiculo:8080
      NOTIFICACION_URL: http://ms-notificacion:8080
    depends_on:
      mysql-estacionamientos:
        condition: service_healthy
      ms-vehiculo:
        condition: service_started
      ms-notificacion:
        condition: service_started

